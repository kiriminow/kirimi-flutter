name: release

# The tag pattern must match the one configured on pub.dev
# (Admin -> Automated publishing), which is `v{{version}}`.
# Note: pub.dev only accepts publishing from workflows triggered by a tag.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: verify tag matches version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')"
          if [ "$tag" != "$ver" ]; then
            echo "tag=$tag pubspec.yaml=$ver" >&2
            exit 1
          fi

      - run: dart pub get
      # Info-level lints are tolerated (there are pre-existing sort_constructors_first
      # hints); warnings and errors still fail the release.
      - run: dart analyze --no-fatal-warnings
      - run: dart test

  publish:
    needs: verify
    permissions:
      id-token: write # Required for OIDC authentication with pub.dev
    # Dart's reusable workflow handles the OIDC exchange and publishing.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
